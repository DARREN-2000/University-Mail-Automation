{% extends "base.html" %}
{% block title %}Create Campaign{% endblock %}
{% block content %}
<h1>Create Campaign</h1>

<div class="card">
    <form method="POST" action="{{ url_for('create_campaign') }}">
        <div class="form-group">
            <label for="name">Campaign Name</label>
            <input type="text" id="name" name="name" placeholder="e.g. Spring Career Fair 2025" required>
        </div>

        <div class="form-group">
            <label for="subject">Email Subject Line</label>
            <input type="text" id="subject" name="subject" placeholder="e.g. You're invited to the Spring Career Fair!" required>
        </div>

        <div class="form-group">
            <label for="target_tag">Target Audience (optional)</label>
            <select id="target_tag" name="target_tag">
                <option value="">All Subscribers</option>
                {% for tag in tags %}
                <option value="{{ tag.name }}">{{ tag.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="scheduled_at">Schedule Send (optional)</label>
            <input type="datetime-local" id="scheduled_at" name="scheduled_at">
        </div>

        <div class="form-group">
            <label for="body_html">Email Body (HTML)</label>
            <textarea id="body_html" name="body_html" rows="12" placeholder="Write your email content here... HTML is supported." required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Create Campaign</button>
        <a href="{{ url_for('campaigns') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
